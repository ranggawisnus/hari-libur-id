# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hari-libur-id
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
